<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>WaterNow</title>
<!-- GitHub Pages serves this same file for every address it has no file for, at any depth (e/<slug>, e/<slug>/,
     x/y/z...): its links start at the site's root folder, /WaterNow-site/ (the path of SITE_URL in
     .github/gen-share-pages.mjs; spot-params.test.js checks they match). An app share e/<slug>/ or p/<slug>/ without
     its preview folder, with or without its last slash, goes to e/?s=<slug> (assets/notfound.js). -->
<link rel="icon" href="/WaterNow-site/assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/WaterNow-site/assets/site.css">
<script src="/WaterNow-site/assets/hold.js"></script>
</head>
<body>
<header class="bar"><a class="brand" href="/WaterNow-site/"><img class="logo" src="/WaterNow-site/assets/icon.svg" alt="" width="32" height="32">WaterNow</a></header>
<main class="page hold">
  <section class="card lost">
    <p class="eyebrow" id="code">404</p>
    <h1 id="title">This page doesn't exist</h1>
    <p class="muted" id="text">The link may be incomplete, or the page was moved.</p>
    <a class="btn primary wide" id="home" href="/WaterNow-site/">Go to WaterNow's home page</a>
  </section>
</main>
<script src="/WaterNow-site/assets/spot-params.js"></script>
<script src="/WaterNow-site/assets/notfound.js"></script>
</body>
</html>
